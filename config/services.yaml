datadog:
  api_key: "${DD_API_KEY}"
  site: "datadoghq.com"  # Use datadoghq.eu for EU
  
services:
  travelduty:
    enabled: true
    rate_per_minute: 30
    tags:
      - "env:prod"
      - "service:travelduty"
      - "team:platform"
    hostnames:
      - "travelduty-api-01"
      - "travelduty-api-02"
      - "travelduty-sync-01"
    log_patterns:
      - level: "info"
        weight: 60
        templates:
          - "API request completed in {duration_ms}ms"
          - "Successfully synced {trip_count} trips from {provider}"
          - "Cache hit for key {cache_key}"
          - "Health check passed - all systems operational"
          - "Trip notification sent to customer {customer_id}"
        attributes:
          duration_ms: [45, 150, 300, 500, 800]
          trip_count: [10, 50, 150, 247, 324]
          provider: ["amadeus", "sabre", "tripactions"]
          cache_key: ["trips:abc", "users:xyz", "bookings:123"]
          customer_id: ["cust-001", "cust-002", "cust-003", "cust-004"]
          
      - level: "warn"
        weight: 25
        templates:
          - "API latency high: {latency_ms}ms (threshold: {threshold_ms}ms)"
          - "Provider {provider} rate limit approaching: {current_rate}/{max_rate}"
          - "Redis connection pool at {pool_percentage}% capacity"
          - "Retry attempt {retry_count} for trip sync"
          - "Database query slow: {query_time_ms}ms"
        attributes:
          latency_ms: [800, 1200, 1800, 2340]
          threshold_ms: [500]
          provider: ["amadeus", "sabre", "tripactions"]
          current_rate: [850, 920, 980]
          max_rate: [1000]
          pool_percentage: [75, 85, 92]
          retry_count: [1, 2, 3]
          query_time_ms: [1200, 2500, 4100]
          
      - level: "error"
        weight: 10
        templates:
          - "Failed to sync trip {trip_id}: {error_message}"
          - "Database connection failed: {error_message}"
          - "Provider {provider} API error: {status_code}"
          - "Authentication failed for customer {customer_id}"
          - "Worker crashed: {error_message}"
        attributes:
          trip_id: ["trip-12345", "trip-67890", "trip-11111", "trip-99999"]
          error_message: ["Connection timeout", "Invalid response", "Rate limit exceeded", "Database deadlock", "Out of memory"]
          provider: ["amadeus", "sabre", "tripactions"]
          status_code: [500, 502, 503, 429]
          customer_id: ["cust-001", "cust-002", "cust-003"]
          
      - level: "debug"
        weight: 5
        templates:
          - "Processing trip sync job {job_id}"
          - "Cache miss for key {cache_key}, fetching from database"
          - "Worker {worker_id} polling queue"
          - "JWT token validated for user {user_id}"
        attributes:
          job_id: ["job-aaa", "job-bbb", "job-ccc"]
          cache_key: ["trips:abc", "users:xyz"]
          worker_id: [1, 2, 3, 4, 5]
          user_id: ["user-123", "user-456", "user-789"]

  payment-service:
    enabled: true
    rate_per_minute: 20
    tags:
      - "env:prod"
      - "service:payment-service"
      - "team:finance"
    hostnames:
      - "payment-api-01"
      - "payment-api-02"
    log_patterns:
      - level: "info"
        weight: 70
        templates:
          - "Payment processed successfully: amount={amount} currency={currency}"
          - "Refund issued for transaction {transaction_id}"
          - "Payment method verified for customer {customer_id}"
          - "Stripe webhook received: event={event_type}"
        attributes:
          amount: [10.99, 25.50, 100.00, 499.99, 1250.00]
          currency: ["USD", "EUR", "GBP"]
          transaction_id: ["txn-abc123", "txn-def456", "txn-ghi789"]
          customer_id: ["cust-001", "cust-002", "cust-003"]
          event_type: ["payment_intent.succeeded", "charge.succeeded", "refund.created"]
          
      - level: "warn"
        weight: 20
        templates:
          - "Payment verification taking longer than expected: {duration_ms}ms"
          - "Unusual payment pattern detected for customer {customer_id}"
          - "Stripe API rate limit warning: {rate_remaining}/{rate_limit}"
        attributes:
          duration_ms: [3000, 5000, 8000]
          customer_id: ["cust-001", "cust-002"]
          rate_remaining: [50, 100, 200]
          rate_limit: [1000]
          
      - level: "error"
        weight: 10
        templates:
          - "Payment failed: {error_code} - {error_message}"
          - "Stripe webhook signature verification failed"
          - "Refund processing failed for transaction {transaction_id}"
        attributes:
          error_code: ["card_declined", "insufficient_funds", "payment_method_not_available"]
          error_message: ["Card declined by issuer", "Insufficient funds", "Payment method expired"]
          transaction_id: ["txn-abc123", "txn-def456"]

  notification-worker:
    enabled: true
    rate_per_minute: 45
    tags:
      - "env:prod"
      - "service:notification-worker"
      - "team:platform"
    hostnames:
      - "notification-worker-01"
      - "notification-worker-02"
      - "notification-worker-03"
    log_patterns:
      - level: "info"
        weight: 75
        templates:
          - "Email sent successfully to {recipient}"
          - "SMS delivered: message_id={message_id}"
          - "Push notification sent to {device_count} devices"
          - "Notification queued: type={notification_type}"
        attributes:
          recipient: ["user@example.com", "admin@example.com", "support@example.com"]
          message_id: ["msg-111", "msg-222", "msg-333"]
          device_count: [1, 2, 5, 10]
          notification_type: ["trip_reminder", "payment_confirmation", "booking_update"]
          
      - level: "warn"
        weight: 15
        templates:
          - "Notification delivery delayed: queue_depth={queue_depth}"
          - "SendGrid rate limit approaching: {current_rate}/{max_rate}"
          - "Retry attempt {retry_count} for notification {notification_id}"
        attributes:
          queue_depth: [500, 1000, 2500]
          current_rate: [8500, 9200, 9800]
          max_rate: [10000]
          retry_count: [1, 2, 3]
          notification_id: ["notif-aaa", "notif-bbb"]
          
      - level: "error"
        weight: 10
        templates:
          - "Failed to send email: {error_message}"
          - "SMS delivery failed: {provider} returned {status_code}"
          - "Push notification failed: invalid device token"
        attributes:
          error_message: ["SMTP connection refused", "Invalid recipient", "Rate limit exceeded"]
          provider: ["twilio", "nexmo"]
          status_code: [400, 429, 500]

  api-gateway:
    enabled: false
    rate_per_minute: 100
    tags:
      - "env:prod"
      - "service:api-gateway"
      - "team:platform"
    hostnames:
      - "gateway-01"
      - "gateway-02"
      - "gateway-03"
    log_patterns:
      - level: "info"
        weight: 85
        templates:
          - "Request routed: {method} {path} -> {backend_service}"
          - "Response: status={status_code} duration={duration_ms}ms"
          - "Rate limit check passed for client {client_id}"
        attributes:
          method: ["GET", "POST", "PUT", "DELETE"]
          path: ["/v1/trips", "/v1/payments", "/v1/users", "/v1/bookings"]
          backend_service: ["travelduty", "payment-service", "user-service"]
          status_code: [200, 201, 204]
          duration_ms: [15, 45, 120, 250]
          client_id: ["client-aaa", "client-bbb", "client-ccc"]
          
      - level: "warn"
        weight: 10
        templates:
          - "High request rate from client {client_id}: {request_count} req/min"
          - "Backend {backend_service} latency high: {latency_ms}ms"
        attributes:
          client_id: ["client-aaa", "client-bbb"]
          request_count: [850, 950, 1050]
          backend_service: ["travelduty", "payment-service"]
          latency_ms: [800, 1200, 2000]
          
      - level: "error"
        weight: 5
        templates:
          - "Request failed: status={status_code} error={error_message}"
          - "Backend {backend_service} unavailable"
          - "Authentication failed: invalid JWT token"
        attributes:
          status_code: [401, 403, 500, 502, 503]
          error_message: ["Unauthorized", "Forbidden", "Internal server error", "Bad gateway"]
          backend_service: ["travelduty", "payment-service"]
